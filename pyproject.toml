[project]
name = "sionna-twin-ops"
version = "0.1.0"
description = "A learned surrogate of a ray tracer for one radio sector on synthetic hilly terrain"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adityo Nugroho" }]
dependencies = [
    "sionna-rt>=2.1.0",
    "numpy>=2.5",
    "torch>=2.14",
    "matplotlib>=3.11",
]

[project.scripts]
twin = "sionna_twin_ops.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sionna_twin_ops"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "mypy>=1.20",
    "nbmake>=1.5.5",
    "nbstripout>=0.9.1",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sionna: needs the Sionna RT llvm backend (slow to import, CPU ray tracing)"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sionna.*", "mitsuba.*", "drjit.*", "jupytext.*"]
ignore_missing_imports = true
